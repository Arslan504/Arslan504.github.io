<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="New Smile Dental Care Centre, Jehanabad — contact us on WhatsApp, Facebook and Instagram." />
    <link rel="icon" href="data:," />
    <title>New Smile Dental Care Centre — Links</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #eef6fb;
        --bg-soft: #f7fbfe;
        --card: #ffffff;
        --ink: #10314a;
        --ink-2: #3f647f;
        --ink-3: #6d8fa8;
        --line: #d7e9f4;
        --blue: #0f7cc4;
        --blue-deep: #0a5c94;
        --badge-bg: #0f7cc4;
        --badge-ring: #ffffff;
        --shadow: 0 10px 28px rgba(15, 83, 128, 0.10), 0 2px 6px rgba(15, 83, 128, 0.06);
        --shadow-btn: 0 8px 20px rgba(16, 49, 74, 0.10);
        --btn-bg: #ffffff;
        --btn-line: #dceef8;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          color-scheme: dark;
          --bg: #0b1c2a;
          --bg-soft: #0e2436;
          --card: #122c42;
          --ink: #eaf4fb;
          --ink-2: #b7d3e6;
          --ink-3: #84a7bf;
          --line: #1f415c;
          --blue: #4db2ec;
          --blue-deep: #9fd3f5;
          --badge-bg: #1273b4;
          --badge-ring: #122c42;
          --shadow: 0 10px 28px rgba(0, 0, 0, 0.35);
          --shadow-btn: 0 8px 20px rgba(0, 0, 0, 0.35);
          --btn-bg: #132e45;
          --btn-line: #21465f;
        }
      }

      * { box-sizing: border-box; }
      html { -webkit-text-size-adjust: 100%; }
      body {
        margin: 0;
        font-family: ui-sans-system, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        color: var(--ink);
        background:
          radial-gradient(1100px 500px at 50% -8%, rgba(15, 124, 196, 0.14), transparent 60%),
          linear-gradient(180deg, var(--bg-soft) 0%, var(--bg) 55%, var(--bg) 100%);
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: max(28px, env(safe-area-inset-top)) 18px max(24px, env(safe-area-inset-bottom));
      }

      .wrap {
        width: 100%;
        max-width: 440px;
        display: flex;
        flex-direction: column;
        align-items: center;
        flex: 1;
      }

      /* ---------- Header ---------- */
      .badge {
        width: 96px;
        height: 96px;
        border-radius: 50%;
        background: linear-gradient(145deg, #1a8fd6 0%, #0a5c94 100%);
        display: grid;
        place-items: center;
        box-shadow: 0 14px 30px rgba(10, 92, 148, 0.30);
        border: 4px solid var(--badge-ring);
        margin-top: 10px;
      }
      .badge svg { width: 52px; height: 52px; display: block; }

      h1 {
        margin: 22px 0 0;
        font-size: 1.72rem;
        line-height: 1.18;
        font-weight: 800;
        letter-spacing: -0.02em;
        text-align: center;
      }
      .tagline {
        margin: 8px 0 0;
        font-size: 0.98rem;
        color: var(--ink-2);
        text-align: center;
        font-weight: 500;
      }
      .address {
        margin: 16px 0 0;
        display: inline-flex;
        align-items: flex-start;
        gap: 7px;
        font-size: 0.88rem;
        line-height: 1.45;
        color: var(--ink-3);
        text-align: center;
        max-width: 320px;
      }
      .address svg { flex: 0 0 auto; margin-top: 2px; }

      .divider {
        width: 44px;
        height: 4px;
        border-radius: 999px;
        background: var(--blue);
        opacity: 0.55;
        margin: 26px 0 22px;
      }

      /* ---------- Link buttons ---------- */
      .links {
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .link-btn {
        display: flex;
        align-items: center;
        gap: 15px;
        width: 100%;
        min-height: 76px;
        padding: 14px 18px 14px 15px;
        border-radius: 18px;
        background: var(--btn-bg);
        border: 1px solid var(--btn-line);
        box-shadow: var(--shadow-btn);
        text-decoration: none;
        color: var(--ink);
        -webkit-tap-highlight-color: transparent;
        transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
      }
      .link-btn:hover { transform: translateY(-2px); box-shadow: 0 14px 28px rgba(16, 49, 74, 0.14); }
      .link-btn:active { transform: translateY(0) scale(0.99); }
      .link-btn:focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; }

      .icon-tile {
        flex: 0 0 auto;
        width: 52px;
        height: 52px;
        border-radius: 14px;
        display: grid;
        place-items: center;
        color: #ffffff;
      }
      .icon-tile svg { width: 30px; height: 30px; display: block; }
      .tile-whatsapp { background: #25d366; box-shadow: inset 0 -3px 0 rgba(0,0,0,0.08); }
      .tile-facebook { background: #1877f2; box-shadow: inset 0 -3px 0 rgba(0,0,0,0.10); }
      .tile-instagram {
        background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
        box-shadow: inset 0 -3px 0 rgba(0,0,0,0.10);
      }

      .link-text { flex: 1 1 auto; min-width: 0; text-align: left; }
      .link-label {
        display: block;
        font-size: 1.13rem;
        font-weight: 700;
        letter-spacing: -0.01em;
        line-height: 1.25;
      }
      .link-sub {
        display: block;
        margin-top: 2px;
        font-size: 0.88rem;
        line-height: 1.35;
        color: var(--ink-2);
        overflow-wrap: anywhere;
      }
      .chev { flex: 0 0 auto; color: var(--ink-3); display: grid; place-items: center; }
      .chev svg { width: 20px; height: 20px; display: block; }

      /* ---------- Footer ---------- */
      footer {
        margin-top: 40px;
        padding-top: 20px;
        border-top: 1px solid var(--line);
        width: 100%;
        text-align: center;
      }
      .foot-name { font-size: 0.92rem; font-weight: 700; color: var(--ink); }
      .foot-loc { margin-top: 3px; font-size: 0.84rem; color: var(--ink-3); }

      .clinic-photo {
        width: 100%;
        margin: 4px 0 2px;
        border-radius: 18px;
        overflow: hidden;
        border: 1px solid rgba(10, 94, 99, 0.10);
        box-shadow: 0 10px 26px rgba(7, 39, 43, 0.14);
        line-height: 0;
      }
      .clinic-photo img { width: 100%; height: auto; display: block; }

      @media (max-width: 360px) {
        h1 { font-size: 1.52rem; }
        .link-btn { padding: 13px 14px 13px 13px; gap: 12px; }
        .icon-tile { width: 48px; height: 48px; }
      }
      @media (prefers-reduced-motion: reduce) {
        .link-btn { transition: none; }
        .link-btn:hover { transform: none; }
      }
    </style>
  </head>
  <body>

      <footer>
